services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - chat_network

  web:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db/chatdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chat_network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chatdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  chat_network:
    driver: bridge

volumes:
  pgdata: